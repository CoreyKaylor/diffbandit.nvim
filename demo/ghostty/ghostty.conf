# Pinned Ghostty config for README recordings. Launched with
# --config-default-files=false, so nothing from the user's own Ghostty config
# leaks in. Size is in cells; the recorder downscales the Retina capture.
font-family = JetBrainsMono Nerd Font Mono
font-size = 18
window-width = 112
window-height = 24
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
window-padding-color = background

background = #1F1F28
foreground = #DCD7BA
cursor-color = #C8C093
selection-background = #2D4F67

# Fixed title: the recorder finds the window by it, and nvim must not rename it.
title = diffbandit-demo
window-decoration = none
cursor-style-blink = false
mouse-hide-while-typing = true
shell-integration = none
confirm-close-surface = false
quit-after-last-window-closed = true
window-save-state = never
macos-titlebar-style = hidden
