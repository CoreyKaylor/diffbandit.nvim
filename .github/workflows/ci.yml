name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "lua/**"
      - "plugin/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "lua/**"
      - "plugin/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Neovim tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git tmux

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Check generated help tags
        run: |
          nvim --headless -u NONE -i NONE -c 'helptags doc' -c 'if &modified | cquit | endif' -c qa
          git diff --exit-code -- doc/tags

      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: test-deps-${{ hashFiles('tests/deps.sh') }}

      - name: Fetch test dependencies
        run: tests/deps.sh

      - name: Run tests (unit + integration, parallel)
        run: nvim -l tests/run_all.lua

      - name: Run tmux smoke test
        run: tests/smoke/tmux.sh

      - name: Check whitespace
        run: git diff --check
